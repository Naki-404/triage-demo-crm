name: CI

on:
  push:
    branches: [main, "sprint-*", "release-*"]
  pull_request:

# Least privilege: every job only reads the checkout.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the tag is kept in the comment for Dependabot).
jobs:
  backend:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # backend/.venv is a local convenience only; CI installs the pinned dev requirements directly
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check . ../simulator
      - name: Ruff format check (advisory)
        working-directory: backend
        run: ruff format --check . ../simulator
        continue-on-error: true
      - name: Backend tests
        # backend/pyproject.toml sets testpaths=["tests"] and pythonpath=["."], so run from backend/
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider
      - name: Simulator tests
        # the simulator package is imported as `simulator.*`, so the repo root must be on PYTHONPATH
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest simulator/tests -q -p no:cacheprovider

  dependency-audit:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: pip-audit (runtime and dev requirements)
        run: |
          pip-audit -r backend/requirements.txt --progress-spinner off
          pip-audit -r backend/requirements-dev.txt --progress-spinner off

  secrets:
    # Full history scan; runs separately so a leak is reported even when lint or tests fail.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  docker-image:
    # The compose stack in the CSIP repo builds this image from the repo root; make sure it still builds.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --pull -t qazaq-crm:ci .
