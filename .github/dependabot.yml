# Dependabot opens no pull requests: open-pull-requests-limit 0 turns version updates off, and security updates
# are off in the repository settings. Vulnerability alerts stay on (Security tab), and CI checks every pull request
# with pip-audit and npm audit. To get update PRs back, raise the limits.
# Actions are pinned by commit SHA in the workflows; with PRs on, Dependabot updates the SHA and its "# vX.Y.Z" comment.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
