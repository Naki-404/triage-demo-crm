[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PL", "DTZ", "ERA", "C90"]
ignore = [
    "B008",
    "E501",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLR6301",
    "PLR0917",
    "I001",
    "UP006",
    "UP017",
    "UP042",
    "UP045",
    "C901",
    "DTZ001",
    "DTZ005",
    "DTZ011",
    "SIM102",
    "SIM103",
    "SIM105",
    "PLC0415",
    "PLW0603",
    "B011", # pytest-style assert False in exception tests
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["app"]
